apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-application
  namespace: java-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-application
  template:
    metadata:
      labels:
        app: java-application
    spec:
      containers:
        - name: java-application
          image: REPLACE_WITH_ECR_IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /java-application/
              port: 8080
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /java-application/
              port: 8080
            initialDelaySeconds: 60
