apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: java-application
  namespace: java-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: java-application
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
