apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pruthviraj7733/complete-java-application.git
    targetRevision: dev
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: java-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
