apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pruthviraj7733/complete-java-application.git
    targetRevision: uat
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: java-uat
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
